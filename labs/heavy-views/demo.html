<!doctype html>
<html lang="es">
<head>

<title>Labs · Vistas pesadas</title>
<link rel="stylesheet" href="/src/style.css">
<script type="importmap">{ "imports": { "@zumer/snapdom": "/node_modules/@zumer/snapdom/dist/snapdom.mjs" } }</script>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif; color: #e8eefc; background: #070b16; }
  #bar { flex: none; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 14px; background: #121a33; border-bottom: 1px solid #263055; font-size: 13px; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .group > span { margin-right: 4px; color: #8a94b8; }
  #bar button { font: inherit; color: #dde; background: #1c2647; border: 1px solid #2d3a68; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  #bar button[aria-pressed="true"] { background: #3a5bd9; border-color: #3a5bd9; color: #fff; }
  #bar button:disabled { opacity: .5; cursor: default; }
  #bar #run { background: #1f7a4d; border-color: #1f7a4d; color: #fff; }
  #status { color: #9fb0e0; }

  /* The guide's demo (docs/guides/examples/heavy.html); the stage fills what the bar leaves. */
  .stage { position: relative; flex: 1; min-height: 0; background: radial-gradient(circle at 30% 20%, #23305e, #070b16 70%); }
  .board { width: 100%; height: 100%; padding: 56px 24px 24px; box-sizing: border-box; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; overflow: hidden; }
  .clock { position: absolute; left: 24px; top: 14px; padding: 2px 8px; border-radius: 6px; background: #0e1530; font: 600 15px ui-monospace, monospace; }
  .tile { position: relative; height: 96px; border-radius: 14px; padding: 10px; box-sizing: border-box; background: hsl(var(--h) 70% 60% / .16); border: 1px solid hsl(var(--h) 80% 75% / .35); backdrop-filter: blur(8px) saturate(1.4); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
  .tile.zoom-me { cursor: zoom-in; border-color: hsl(var(--h) 90% 75%); }
  .tile b { display: block; font-size: 12px; opacity: .85; }
  .bars { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 44px; display: flex; align-items: flex-end; gap: 2px; }
  .bars i { flex: 1; border-radius: 2px; background: linear-gradient(hsl(var(--h) 90% 70%), hsl(var(--h) 70% 40%)); }
  .detail { width: 520px; height: 380px; border-radius: 22px; padding: 20px; box-sizing: border-box; background: hsl(var(--h) 45% 16% / .92); border: 1px solid hsl(var(--h) 80% 70% / .5); overflow: hidden; }
  .detail h2 { margin: 0 0 12px; font-size: 18px; }
  .rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .row { height: 22px; border-radius: 6px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; background: hsl(var(--h) 60% 50% / .18); backdrop-filter: blur(4px); }

  /* live=1: a big counter. A zoom that opens on an old photo shows here, by eye. */
  .counter { position: absolute; right: 24px; top: 8px; padding: 0 10px; border-radius: 8px; background: #0e1530; font: 700 28px/1.3 ui-monospace, monospace; }
  /* fx=pane: fixed glass between the current view and each view behind (Martin's idea 1). */
  .z-pane { position: absolute; inset: 0; pointer-events: none; background: rgb(7 11 22 / .3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  /* moving=1: no glass while views move (option 2). */
  .zumly-canvas[data-z-moving] .tile,
  .zumly-canvas[data-z-moving] .row { backdrop-filter: none; -webkit-backdrop-filter: none; }

  /* launch=1: the view coming in moves as a photo taken before the motion (experiment 1), as
     flatten shows the views behind. glass=0 takes the photo without its glass. */
  .z-view.z-launch-flat { background: transparent !important; }
  .z-view.z-launch-flat > :not(.z-launch-layer) { visibility: hidden !important; }
  .z-launch-layer { position: absolute; pointer-events: none; }
  .z-launch-noglass * { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  /* While the photo is taken the trigger looks pressed, and a ring turns over it if it takes long. */
  .z-launch-press { position: absolute; z-index: 10; pointer-events: none; box-sizing: border-box; background: rgb(0 0 0 / .22); box-shadow: inset 0 0 0 2px rgb(255 255 255 / .55); }
  .z-launch-ring { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; box-sizing: border-box; border-radius: 50%; border: 3px solid rgb(255 255 255 / .25); border-top-color: #fff; opacity: 0; animation: z-ring-in 120ms forwards, z-ring-spin 700ms linear infinite; }
  @keyframes z-ring-in { to { opacity: 1 } }
  @keyframes z-ring-spin { to { transform: rotate(1turn) } }
  /* gl=1: views drawn with WebGL (gl.js) are hidden but still answer hit-tests; their effects
     are in the shader, so the CSS filter and its transition are off. */
  .zumly-canvas > .z-gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .z-view.z-gl-off { opacity: 0 !important; filter: none !important; transition: none !important; }
  /* Zumly's nav is glass too, and glass over a WebGL canvas that changes every frame makes the
     GPU wait for the canvas each frame (zoom-out GPU 21 % → 7 %). While WebGL moves the views
     the nav goes without blur, a little more opaque. */
  .zumly-canvas[data-z-gl-moving] :is(.z-nav-back, .z-depth-band, .z-lateral-nav) { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: rgb(20 22 28 / .72) !important; }
</style>
</head>
<body>
<div id="bar"></div>
<div class="stage"><div id="app" class="canvas zumly-canvas"></div></div>
<script type="module">
import { Zumly } from '/src/entry-esm.js'
import { snapdom } from '@zumer/snapdom'
import { stream } from '/node_modules/@zumer/snapdom-plugins/stream.js'
import { createGL } from './gl.js'

// Variants, from the URL. Every change reloads the page, so each one starts clean.
const q = new URLSearchParams(location.search)
const opt = {
  flatten: q.get('flatten') !== '0',
  // filter: Zumly's effects, animated. instant: animateEffects: false. pane: no effects, fixed glass instead.
  fx: ['instant', 'pane'].includes(q.get('fx')) ? q.get('fx') : 'filter',
  moving: q.get('moving') === '1', // option 2: data-z-moving on the canvas while views move
  wc: q.get('wc') === 'lean', // option 12: will-change only for what each view animates
  hold: q.get('hold') === '1', // idea 2: views behind keep will-change, so they are not re-rastered at their new scale
  persp: q.get('persp') !== '0', // option 13: persp=0 takes perspective off the canvas
  live: q.get('live') === '1', // values that change every second, and a big counter
  launch: q.get('launch') === '1', // experiment 1: photograph the view coming in, then move it
  glass: q.get('glass') !== '0', // with launch: glass=0 takes that photo without backdrop-filter
  out: q.get('out') === '1', // with launch: a zoom-out also photographs the view leaving before it shrinks
  gl: q.get('gl') === '1', // experiment 7: zooms drawn with WebGL, and the views behind as textures at rest
  look: q.get('look') || 'css', // with gl: the effects of the views behind (LOOKS)
  driver: q.get('driver') || 'css',
}
const effects = opt.fx !== 'pane'

// With gl=1, the views behind take any effect the shader knows: CSS's filter functions, and
// these, which only WebGL draws. Each is a few lines of GLSL (see EFFECTS in gl.js): v is the
// amount, photo the view's size in CSS px, st the point of the view read.
const GL_EFFECTS = {
  // Squares of v CSS px.
  pixelate: { none: 0, uv: 'vec2 cell = v / photo; st = (floor(st / cell) + 0.5) * cell;' },
  // Red and blue apart by v CSS px, as through a cheap lens.
  chroma: {
    none: 0,
    color: `vec2 d = vec2(v / photo.x, 0.0);
  vec4 r = textureLod(tex, st + d, lod);
  vec4 b = textureLod(tex, st - d, lod);
  rgb.r = r.a > 0.0 ? r.r / r.a : 0.0;
  rgb.b = b.a > 0.0 ? b.b / b.a : 0.0;`,
  },
  // Darker toward the edges of the view, by v (0 to 1).
  vignette: { none: 0, color: 'rgb *= 1.0 - v * smoothstep(0.25, 0.75, distance(st, vec2(0.5)));' },
}
// The effects of the view behind and the one behind it, as the engine takes them.
const LOOKS = {
  css: ['blur(3px) brightness(.7)', 'blur(8px) brightness(.5)'],
  mono: ['grayscale(1) blur(2px) brightness(.6)', 'grayscale(1) blur(6px) brightness(.4)'],
  pixel: ['pixelate(10px) saturate(1.4) brightness(.6)', 'pixelate(20px) brightness(.4)'],
  lens: ['chroma(3px) blur(1.5px) vignette(.8) brightness(.75)', 'chroma(6px) blur(5px) vignette(1) brightness(.5)'],
}

const GROUPS = [
  { label: 'Fotos', key: 'flatten', value: opt.flatten ? '1' : '0', options: [['1', 'flatten'], ['0', 'sin flatten']] },
  { label: 'Efecto', key: 'fx', value: opt.fx, options: [['filter', 'filter animado'], ['instant', 'de golpe'], ['pane', 'capa de vidrio']] },
]
const LOOK_NAMES = [['css', 'blur'], ['mono', 'gris'], ['pixel', 'píxeles'], ['lens', 'lente']]
const TOGGLES = [
  { key: 'moving', on: '1', label: 'marca de movimiento' },
  { key: 'wc', on: 'lean', label: 'will-change justo' },
  { key: 'hold', on: '1', label: 'will-change sostenido' },
  { key: 'persp', on: '0', label: 'sin perspective' },
  { key: 'live', on: '1', label: 'en vivo' },
]
const LAB = [
  { key: 'launch', on: '1', label: 'preparar y animar' },
  { key: 'glass', on: '0', label: 'foto sin vidrio' },
  { key: 'out', on: '1', label: 'también al volver' },
  { key: 'gl', on: '1', label: 'WebGL' },
]
const go = (key, value) => {
  const next = new URLSearchParams(q)
  if (value === null) next.delete(key)
  else next.set(key, value)
  location.search = next.toString()
}
const bar = document.getElementById('bar')
const button = (parent, text, pressed, onClick) => {
  const b = document.createElement('button')
  b.textContent = text
  if (pressed !== null) b.setAttribute('aria-pressed', String(pressed))
  b.addEventListener('click', onClick)
  parent.append(b)
  return b
}
const group = (label) => {
  const g = document.createElement('div')
  g.className = 'group'
  g.innerHTML = label ? `<span>${label}</span>` : ''
  bar.append(g)
  return g
}
for (const { label, key, value, options } of GROUPS) {
  const g = group(label)
  for (const [v, text] of options) button(g, text, v === value, () => go(key, v))
}
const toggles = group('CSS')
for (const { key, on, label } of TOGGLES) {
  const pressed = q.get(key) === on
  button(toggles, label, pressed, () => go(key, pressed ? null : on))
}
const lab = group('Lab')
for (const { key, on, label } of LAB) {
  const pressed = q.get(key) === on
  button(lab, label, pressed, () => go(key, pressed ? null : on))
}
// In the second row, so the canvas keeps the size it has in the measurements.
if (opt.gl) {
  const looks = group('Look')
  for (const [v, text] of LOOK_NAMES) button(looks, text, v === opt.look, () => go('look', v))
}
const run = button(group(''), '▶ 3 zooms', null, () => runByEye())
run.id = 'run'
const status = document.createElement('div')
status.id = 'status'
bar.append(status)

// Variant CSS that overrides src/style.css without touching it.
const css = []
if (!opt.persp) css.push('.zumly-canvas { perspective: none !important }')
if (opt.wc) {
  css.push(
    '.zoom-current-view, .zoom-current-view-reverse, .zoom-lateral-back { will-change: transform !important }',
    '.zoom-lateral-in, .zoom-lateral-out { will-change: transform, opacity !important }',
    `.zoom-previous-view, .zoom-previous-view-reverse, .zoom-last-view, .zoom-last-view-reverse { will-change: ${effects ? 'transform, filter' : 'transform'} !important }`)
}
// navglass=0, for diagnosis: Zumly's nav (back button, depth bands, sibling bar) without its glass.
if (q.get('navglass') === '0') css.push('.z-nav-back, .z-depth-band, .z-lateral-nav { backdrop-filter: none !important; -webkit-backdrop-filter: none !important }')
if (opt.hold) css.push('.zumly-canvas > .z-view.is-previous-view, .zumly-canvas > .z-view.is-last-view { will-change: transform, opacity, filter }')
if (css.length) document.head.insertAdjacentHTML('beforeend', `<style>${css.join('\n')}</style>`)

// The guide's views, with a value per tile, a counter and changing readings when live.
const hues = [200, 280, 150, 30, 330, 180, 100, 240]
const bars = n => Array.from({ length: n }, (_, i) => `<i style="height:${20 + ((i * 37) % 80)}%"></i>`).join('')

function board () {
  let tiles = ''
  for (let i = 0; i < 48; i++) {
    const h = hues[i % hues.length]
    const name = `Sensor ${i + 1}`
    // Every seventh tile opens its readings.
    const opens = i % 7 === 3
    const className = opens ? 'tile zoom-me' : 'tile'
    const data = opens ? ` data-to="detail" data-h="${h}" data-title="${name}"` : ''
    const value = opt.live ? ` · <span class="v">${(i * 37) % 100}</span>` : ''
    tiles += `<div class="${className}"${data} style="--h:${h}"><b>${name}${value}</b><div class="bars">${bars(24)}</div></div>`
  }
  const counter = opt.live ? '<span class="counter">0</span>' : ''
  // The last row does not fit at 800 px. Its overflow hides nothing on purpose, so with gl=1 a
  // zoom shows it whole (data-gl-overflow).
  return `<div class="z-view board" data-title="Board" data-gl-overflow><span class="clock">--:--:--</span>${counter}${tiles}</div>`
}

function detail ({ target, props }) {
  target.className = 'z-view detail'
  target.style.setProperty('--h', props.h)
  let rows = ''
  for (let i = 0; i < 90; i++) rows += `<div class="row"><span>reading ${i + 1}</span><span>${(Math.sin(i) * 50 + 50).toFixed(1)}</span></div>`
  target.innerHTML = `<h2>${props.title}</h2><div class="rows">${rows}</div>`
}

const app = new Zumly({
  mount: '#app',
  initialView: 'board',
  views: { board: board(), detail },
  transitions: {
    driver: opt.driver,
    // Blur and dim the board behind, as the guide does (with gl=1, the look chosen); with fx=pane
    // the glass does it.
    effects: effects ? (opt.gl && LOOKS[opt.look]) || LOOKS.css : ['none', 'none'],
    animateEffects: opt.fx !== 'instant',
  },
  // The stream is wrapped to log its frames (window.streamLog), for debugging flatten; with gl=1
  // each frame also goes into the view's texture.
  flatten: opt.flatten && {
    snapdom,
    stream: (el, options) => stream(el, {
      ...options,
      onFrame (frame) {
        window.streamLog.push({ t: Math.round(performance.now()), view: el.dataset.viewName, reason: frame.reason, full: frame.full, ms: Math.round(frame.ms) })
        glr?.feed(el, frame, options)
        options.onFrame?.(frame)
      },
    }),
  },
})
let glr = null
window.streamLog = []

const parseMs = (d) => {
  const m = String(d).trim().match(/^(\d*\.?\d+)(ms|s)?$/)
  return m ? parseFloat(m[1]) * (m[2] === 'ms' ? 1 : 1000) : 1000
}

// fx=pane: a pane goes right after each view behind, so the current view sits on all of
// them and a deeper view gets more blur. A zoom-in fades in the pane over the view going
// behind; a zoom-out fades out the one over the view coming back.
const panes = {
  make () {
    const pane = document.createElement('div')
    pane.className = 'z-pane'
    pane.setAttribute('aria-hidden', 'true')
    return pane
  },
  fade (pane, from, to, spec) {
    pane.animate([{ opacity: from }, { opacity: to }], { duration: parseMs(spec.duration), easing: spec.ease, fill: 'forwards' })
  },
  start (spec) {
    const canvas = app.canvas
    // A pane over nothing (its view was detached) would only blur the page.
    for (const pane of canvas.querySelectorAll(':scope > .z-pane')) {
      if (!pane.previousElementSibling?.classList.contains('z-view')) pane.remove()
    }
    if (spec.type === 'zoomIn') {
      const pane = this.make()
      canvas.insertBefore(pane, spec.currentView)
      this.fade(pane, 0, 1, spec)
    } else if (spec.type === 'zoomOut') {
      const over = spec.currentView.previousElementSibling
      if (over?.classList.contains('z-pane')) this.fade(over, 1, 0, spec)
    }
  },
  sync () {
    const canvas = app.canvas
    for (const pane of canvas.querySelectorAll(':scope > .z-pane')) pane.remove()
    for (const view of canvas.querySelectorAll(':scope > .z-view.is-previous-view, :scope > .z-view.is-last-view')) view.after(this.make())
  },
}

// launch=1 (experiment 1): before a zoom-in moves, the view coming in is photographed with
// SnapDOM; it moves as that photo and becomes itself when the motion ends. Its first style,
// layout and paint, and flatten hiding the view behind, happen before the motion instead of
// in its first frames. While the photo is taken the trigger looks pressed; past RING_AFTER_MS
// a ring turns over it, and once shown it stays RING_MIN_MS so it does not flicker.
// With out=1, a zoom-out photographs the view leaving, in place, and shrinks that photo.
const RING_AFTER_MS = 300
const RING_MIN_MS = 400
window.launchLog = []
const afterFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)))
const launch = {
  press (trigger) {
    const stage = app.canvas.parentElement
    const r = trigger.getBoundingClientRect()
    const s = stage.getBoundingClientRect()
    const press = document.createElement('div')
    press.className = 'z-launch-press'
    Object.assign(press.style, { left: `${r.left - s.left}px`, top: `${r.top - s.top}px`, width: `${r.width}px`, height: `${r.height}px`, borderRadius: getComputedStyle(trigger).borderRadius })
    const ring = document.createElement('i')
    ring.className = 'z-launch-ring'
    ring.style.animationDelay = `${RING_AFTER_MS}ms, 0ms`
    press.append(ring)
    stage.append(press)
    return press
  },
  // The effects of the views behind start with the zoom, and so does the engine's fade of a
  // zoom-out into its trigger; they wait where they are, and release() lets them run with the motion.
  hold (views, moving) {
    for (const view of views) {
      view.style.filter = getComputedStyle(view).filter
      view.style.transition = 'none'
    }
    const fades = moving.getAnimations().filter(a => !(a instanceof CSSAnimation) && !(a instanceof CSSTransition))
    for (const fade of fades) fade.pause()
    return () => {
      for (const view of views) {
        view.style.removeProperty('filter')
        view.style.removeProperty('transition')
      }
      for (const fade of fades) fade.play()
    }
  },
  // options: more SnapDOM options (a clip); glass, to keep or drop the glass whatever the demo
  // says; wait: false, to read the view without waiting a frame.
  async photo (view, offscreen, { glass = opt.glass, wait = true, ...options } = {}) {
    // A view coming in goes out of sight while SnapDOM reads it, at scale 1 (outerTransforms:
    // false keeps a root scale). The engine hands it over hidden (.hide is opacity 0, until the
    // driver shows it), and SnapDOM would copy that opacity into the photo. A view leaving is
    // read where it is.
    const transform = view.style.transform
    const hidden = view.classList.contains('hide')
    if (offscreen) {
      view.style.transform = 'translate(-200vw, 0)'
      view.style.contentVisibility = 'visible'
      view.classList.remove('hide')
    }
    if (!glass) view.classList.add('z-launch-noglass')
    try {
      if (wait) await afterFrame()
      const t = performance.now()
      const result = await snapdom(view, { outerTransforms: false, outerShadows: false, fast: true, excludeStyleProps: prop => prop.startsWith('outline'), ...options })
      const canvas = await result.toCanvas()
      return { canvas, ms: Math.round(performance.now() - t) }
    } finally {
      view.classList.remove('z-launch-noglass')
      view.classList.toggle('hide', hidden)
      view.style.transform = transform
    }
  },
  // The photo covers the border box, as flatten's does; the view's border stays real. SnapDOM's
  // canvas has a margin around the box (1 px a side, 3 px with a root transform), so it goes at
  // its own size, centred on the box: fitted to the box, it would come out smaller and shifted.
  flat (view, canvas) {
    canvas.className = 'z-launch-layer'
    canvas.setAttribute('aria-hidden', 'true')
    const width = canvas.width / devicePixelRatio
    const height = canvas.height / devicePixelRatio
    Object.assign(canvas.style, {
      left: `${-view.clientLeft - (width - view.offsetWidth) / 2}px`,
      top: `${-view.clientTop - (height - view.offsetHeight) / 2}px`,
      width: `${width}px`,
      height: `${height}px`,
    })
    view.append(canvas)
    view.classList.add('z-launch-flat')
  },
  // At the end the photo just goes, as flatten does with a translucent view.
  unflat (view) {
    view.classList.remove('z-launch-flat')
    view.querySelector(':scope > .z-launch-layer')?.remove()
  },
  // work(spec) gets the zoom ready and returns what to log; by default, the photo of the view
  // coming in, shown in its place.
  async prepare (spec, step, work = (s) => this.photo(s.currentView, s.type === 'zoomIn').then(({ canvas, ms }) => {
    this.flat(s.currentView, canvas)
    return { photoMs: ms }
  })) {
    const t0 = performance.now()
    performance.mark(`z:${step}:prepare-start`)
    const zoomIn = spec.type === 'zoomIn'
    const view = spec.currentView
    const entry = { step, type: spec.type, view: view.dataset.viewName, glass: opt.glass }
    const trigger = zoomIn ? spec.previousView.querySelector('.zoom-me.zoomed') : null
    const press = trigger ? this.press(trigger) : null
    const release = this.hold([spec.previousView, spec.lastView].filter(Boolean), view)
    let result = null
    try {
      result = await work(spec)
      Object.assign(entry, result?.info || result)
    } catch (error) {
      // No photo: the view moves as itself, as without launch.
      entry.error = error.message
    }
    const waited = performance.now() - t0
    entry.ring = waited > RING_AFTER_MS
    if (entry.ring && waited < RING_AFTER_MS + RING_MIN_MS) await new Promise(r => setTimeout(r, RING_AFTER_MS + RING_MIN_MS - waited))
    entry.prepareMs = Math.round(performance.now() - t0)
    press?.remove()
    release()
    window.launchLog.push(entry)
    return result
  },
}

// Wrap the driver: performance marks line each step up with a Chromium trace (measure.mjs),
// and the moving mark and the panes follow the real motion.
let stepIndex = 0
// Which views move as photos in each transition, and what Zumly said, for debugging flatten.
window.flatLog = []
window.notes = []
const notify = app.notify.bind(app)
app.notify = (msg, type) => {
  window.notes.push({ t: Math.round(performance.now()), msg })
  return notify(msg, type)
}
const real = app.transitionDriver
app.transitionDriver = {
  runTransition (spec, done) {
    const step = stepIndex
    const go = (run = (s, cb) => real.runTransition(s, cb)) => {
      performance.mark(`z:${step}:motion-start`)
      window.flatLog.push({
        step,
        type: spec.type,
        flat: [...app.canvas.querySelectorAll(':scope > .z-view.z-flat')].map(v => v.dataset.viewName),
        photos: [...app.canvas.querySelectorAll(':scope > .z-view')].filter(v => app._flattener?.photos.has(v)).map(v => v.dataset.viewName),
        live: [...app.canvas.querySelectorAll(':scope > .z-view')].filter(v => app._flattener?.live.has(v)).map(v => v.dataset.viewName),
      })
      if (opt.moving) app.canvas.dataset.zMoving = spec.type
      if (opt.fx === 'pane') panes.start(spec)
      return run(spec, () => {
        performance.mark(`z:${step}:motion-end`)
        delete app.canvas.dataset.zMoving
        if (opt.fx === 'pane') panes.sync()
        if (opt.launch && spec.type === 'zoomIn') launch.unflat(spec.currentView)
        done()
      })
    }
    // gl=1: WebGL draws zooms in and out, and moves to a sibling, once their textures are ready.
    // Anything else (textures it could not get, keepAlive 'visible') runs on the real driver,
    // with every view back to DOM until it ends.
    const dom = () => {
      glr.release()
      return go((s, cb) => real.runTransition(s, () => { cb(); requestAnimationFrame(() => glr.sync()) }))
    }
    if (glr && !glr.lost && (spec.type === 'zoomIn' || spec.type === 'zoomOut' || spec.type === 'lateral')) {
      launch.prepare(spec, step, s => glr.prepare(s))
        .catch(error => { window.notes.push({ t: Math.round(performance.now()), msg: `gl: ${error.message}` }) })
        .then(prepared => prepared ? go((s, cb) => glr.run(s, prepared, cb)) : dom())
      return
    }
    if (glr) return dom()
    // The view leaving a zoom-out is removed at the end, photo and all. Whatever happens while
    // preparing, the zoom still moves.
    if (opt.launch && (spec.type === 'zoomIn' || (opt.out && spec.type === 'zoomOut'))) {
      launch.prepare(spec, step).catch(error => window.notes.push({ t: Math.round(performance.now()), msg: `launch: ${error.message}` })).then(() => go())
    } else go()
  },
}
await app.init()
if (opt.gl) {
  glr = createGL(app, {
    photo: (view, offscreen, options) => launch.photo(view, offscreen, options),
    flattener: () => app._flattener,
    log: msg => window.notes.push({ t: Math.round(performance.now()), msg }),
    effects: GL_EFFECTS,
  })
}

// Something alive on the board, as a real dashboard has.
setInterval(() => {
  for (const clock of document.querySelectorAll('#app .clock')) clock.textContent = new Date().toLocaleTimeString()
}, 250)
if (opt.live) {
  let count = 0
  setInterval(() => {
    count++
    for (const counter of document.querySelectorAll('#app .counter')) counter.textContent = String(count)
  }, 100)
  let tick = 0
  setInterval(() => {
    tick++
    document.querySelectorAll('#app .tile .v').forEach((v, i) => { if (i % 3 === tick % 3) v.textContent = String((i * 37 + tick * 11) % 100) })
    document.querySelectorAll('#app .row span:last-child').forEach((v, i) => { if (i % 5 === tick % 5) v.textContent = (Math.sin(i + tick) * 50 + 50).toFixed(1) })
  }, 1000)
}

setInterval(() => {
  if (!opt.flatten) { status.textContent = 'Sin flatten'; return }
  const flat = app.canvas.querySelectorAll(':scope > .z-view.z-flat').length
  const current = app.canvas.querySelector(':scope > .z-view.is-current-view')
  status.textContent = `Fotos detrás: ${flat}` + (app._flattener?.photos.has(current) ? ' · foto de esta vista lista' : '')
}, 200)

// ── Steps, for measure.mjs and by eye ────────────────────────────────

const wait = (ms) => new Promise(r => setTimeout(r, ms))
const once = (event) => new Promise(r => { const fn = () => { app.off(event, fn); r() }; app.on(event, fn) })

async function step (kind, trigger) {
  stepIndex++
  const done = once(kind === 'in' ? 'afterZoomIn' : 'afterZoomOut')
  performance.mark(`z:${stepIndex}:${kind}:click`)
  if (kind === 'in') app.zoomIn(trigger)
  else app.zoomOut()
  await done
}

async function rest (ms) {
  performance.mark(`z:${stepIndex}:rest-start`)
  await wait(ms)
  performance.mark(`z:${stepIndex}:rest-end`)
}

// rounds × (zoom into a tile, look around, zoom out, look around), a different tile each time.
window.bench = async ({ rounds = 3, settle = 1200, restMs = 2000 } = {}) => {
  while (app.zoomLevel() > 1) await app.zoomOut()
  await wait(settle)
  for (let i = 0; i < rounds; i++) {
    const triggers = [...app.canvas.querySelectorAll(':scope > .is-current-view .zoom-me')]
    await step('in', triggers[i % triggers.length])
    await wait(settle)
    if (restMs) await rest(restMs)
    await step('out')
    await wait(settle)
    if (restMs) await rest(restMs)
  }
  return { opt }
}

// One step on its own, for film.mjs: into the first tile of the current view, or out.
window.step = (kind) => step(kind, kind === 'in' ? app.canvas.querySelector(':scope > .is-current-view .zoom-me') : null)

async function runByEye () {
  run.disabled = true
  try { await window.bench({ rounds: 3, settle: 1500, restMs: 0 }) } finally { run.disabled = false }
}

window.app = app
window.launch = launch
window.glr = glr
window.ready = true
</script>
</body>
</html>
