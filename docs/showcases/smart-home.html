<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Analytics, cookie consent and events for zumerlab.com -->
  <script async src="/zumerlab.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart home — a Zumly showcase</title>
  <meta name="description" content="A Zumly showcase: rooms, lights and a dimmer, written as function views that keep their state when you zoom back out." />
  <link rel="canonical" href="https://zumerlab.com/zumly/showcases/smart-home.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Smart home — a Zumly showcase" />
  <meta property="og:description" content="A Zumly showcase: rooms, lights and a dimmer, written as function views that keep their state when you zoom back out." />
  <meta property="og:url" content="https://zumerlab.com/zumly/showcases/smart-home.html" />
  <meta property="og:image" content="https://zumerlab.com/zumly/zumly-logo.png" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="https://unpkg.com/zumly/dist/zumly.css" />
  <link rel="stylesheet" href="../css/showcases.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    .stage { position: fixed; inset: 0; }
    .back-to-site { position: fixed; z-index: 50; bottom: 20px; right: 16px; font: 600 12px Inter, system-ui, sans-serif; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 99px; background: rgba(10, 14, 24, 0.55); backdrop-filter: blur(8px); }
  </style>
</head>
<body>
  <div class="stage"><div class="canvas zumly-canvas"></div></div>
  <a class="back-to-site" href="../">Zumly &#8599;</a>
  <noscript><p>A Zumly showcase: rooms, lights and a dimmer, written as function views that keep their state when you zoom back out. This showcase needs JavaScript. <a href="../learn/">Learn Zumly</a>.</p></noscript>

  <script src="https://unpkg.com/zumly/dist/zumly.js"></script>
  <script src="../js/showcases.js"></script>
  <script>
    var sc = window.ZumlyShowcases
    var app = new Zumly(Object.assign({
      mount: '.canvas',
      initialView: sc.house.root,
      views: sc.house.views,
      depthNav: sc.depthNav.home
    }, sc.options))
    app.use(Zumly.Router)
    // Every view a visitor zooms or slides to, for the site analytics (/zumerlab.js)
    app.on('viewChanged', function (e) { if (window.zumerlab && e.type !== 'init') window.zumerlab.track('zoom_view', { view: e.viewName, nav: e.type }) })
    app.init()
  </script>
</body>
</html>
