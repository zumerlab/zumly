<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zumly · Vue</title>
  <link rel="stylesheet" href="https://unpkg.com/zumly/dist/zumly.css">
  <link rel="stylesheet" href="../../css/example.css">
  <script src="https://unpkg.com/zumly/dist/zumly.js"></script>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
</head>
<body>
  <div class="stage">
    <div class="canvas zumly-canvas"></div>
  </div>
  <script>
    const { createApp, ref, version } = Vue

    const planets = [
      { id: 'mercury', name: 'Mercury', fact: 'A year lasts 88 days.' },
      { id: 'venus', name: 'Venus', fact: 'Hotter than Mercury, though farther from the Sun.' },
      { id: 'earth', name: 'Earth', fact: 'The only one with oceans on the surface.' },
      { id: 'mars', name: 'Mars', fact: 'Home of the tallest volcano we know.' }
    ]

    const List = {
      setup: () => ({ planets, likes: ref(0), version }),
      template: `
        <h1>Planets</h1>
        <div class="row">
          <div v-for="p in planets" :key="p.id" :class="['zoom-me', 'planet', p.id]" :data-to="p.id">{{ p.name }}</div>
        </div>
        <button @click="likes++">♥ {{ likes }}</button>
        <p class="hint">Like a few times, open a planet and come back: the list stays mounted, so Vue keeps the count.</p>
        <span class="tag">rendered by Vue {{ version }}</span>`
    }

    const Planet = {
      props: ['planet'],
      template: `<h2>{{ planet.name }}</h2><p>{{ planet.fact }}</p><span class="tag">Vue component</span>`
    }

    // Each view is its own Vue app, unmounted when Zumly discards the view
    const mountView = (className, title, component, props) => ({ target, onCleanup }) => {
      target.className = 'z-view ' + className
      target.dataset.title = title
      const view = createApp(component, props)
      view.mount(target)
      onCleanup(() => view.unmount())
    }

    const views = { list: mountView('list', 'Planets', List) }
    for (const planet of planets) {
      views[planet.id] = mountView('planet-view ' + planet.id, planet.name, Planet, { planet })
    }

    new Zumly({ mount: '.canvas', initialView: 'list', views, lateralNav: { swipe: true } }).init()
  </script>
</body>
</html>
