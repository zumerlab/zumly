<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zumly · React</title>
  <link rel="stylesheet" href="https://unpkg.com/zumly/dist/zumly.css">
  <link rel="stylesheet" href="../../css/example.css">
  <script src="https://unpkg.com/zumly/dist/zumly.js"></script>
</head>
<body>
  <div class="stage">
    <div class="canvas zumly-canvas"></div>
  </div>
  <script type="module">
    import React, { useState } from 'https://esm.sh/react@18.3.1'
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client'
    import htm from 'https://esm.sh/htm@3.1.1'
    const html = htm.bind(React.createElement)   // JSX without a build step

    const planets = [
      { id: 'mercury', name: 'Mercury', fact: 'A year lasts 88 days.' },
      { id: 'venus', name: 'Venus', fact: 'Hotter than Mercury, though farther from the Sun.' },
      { id: 'earth', name: 'Earth', fact: 'The only one with oceans on the surface.' },
      { id: 'mars', name: 'Mars', fact: 'Home of the tallest volcano we know.' }
    ]

    function List () {
      const [likes, setLikes] = useState(0)
      return html`
        <h1>Planets</h1>
        <div class="row">
          ${planets.map(p => html`<div key=${p.id} class=${'zoom-me planet ' + p.id} data-to=${p.id}>${p.name}</div>`)}
        </div>
        <button onClick=${() => setLikes(likes + 1)}>♥ ${likes}</button>
        <p class="hint">Like a few times, open a planet and come back: the list stays mounted, so React keeps the count.</p>
        <span class="tag">rendered by React ${React.version}</span>`
    }

    function Planet ({ planet }) {
      return html`<h2>${planet.name}</h2><p>${planet.fact}</p><span class="tag">React component</span>`
    }

    // Each view gets its own React root, unmounted when Zumly discards the view
    const mountView = (className, title, render) => ({ target, onCleanup }) => {
      target.className = 'z-view ' + className
      target.dataset.title = title
      const root = createRoot(target)
      root.render(render())
      onCleanup(() => root.unmount())
    }

    const views = { list: mountView('list', 'Planets', () => html`<${List} />`) }
    for (const planet of planets) {
      views[planet.id] = mountView('planet-view ' + planet.id, planet.name, () => html`<${Planet} planet=${planet} />`)
    }

    new Zumly({ mount: '.canvas', initialView: 'list', views, lateralNav: { swipe: true } }).init()
  </script>
</body>
</html>
