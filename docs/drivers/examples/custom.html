<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zumly · Custom driver</title>
  <link rel="stylesheet" href="https://unpkg.com/zumly/dist/zumly.css">
  <link rel="stylesheet" href="../../css/example.css">
  <script src="https://unpkg.com/zumly/dist/zumly.js"></script>
</head>
<body>
  <div class="stage">
    <div class="canvas zumly-canvas"></div>
  </div>
  <script type="module">
    import {
      parseDurationMs, showViews, applyZoomInEndState, applyZoomOutPreviousState, applyZoomOutLastState,
      removeViewFromCanvas, runLateralInstant, createFinishGuard, SAFETY_BUFFER_MS
    } from 'https://unpkg.com/zumly/src/drivers/driver-helpers.js'

    // A crossfade instead of a zoom: views jump to their final place, opacity does the rest
    function crossfade (spec, onComplete) {
      const { type, currentView, previousView, lastView, currentStage, duration, canvas } = spec
      if (type === 'lateral') return runLateralInstant(spec, onComplete)
      const ms = parseDurationMs(duration)
      showViews(currentView, previousView, lastView)

      if (type === 'zoomIn') {
        for (const view of [currentView, previousView, lastView]) if (view) applyZoomInEndState(view, currentStage)
        currentView.style.opacity = '0'
        const { finish } = createFinishGuard(() => {
          currentView.style.transition = currentView.style.opacity = ''
          onComplete()
        }, ms + SAFETY_BUFFER_MS)
        requestAnimationFrame(() => {
          currentView.style.transition = `opacity ${ms}ms ease`
          currentView.style.opacity = '1'
          currentView.addEventListener('transitionend', finish, { once: true })
        })
        return
      }

      if (type === 'zoomOut') {
        applyZoomOutPreviousState(previousView, currentStage.views[1].backwardState)
        if (lastView) applyZoomOutLastState(lastView, currentStage.views[2].backwardState)
        const { finish } = createFinishGuard(() => {
          removeViewFromCanvas(currentView, canvas)
          onComplete()
        }, ms + SAFETY_BUFFER_MS)
        requestAnimationFrame(() => {
          currentView.style.transition = `opacity ${ms}ms ease`
          currentView.style.opacity = '0'
          currentView.addEventListener('transitionend', finish, { once: true })
        })
        return
      }
      onComplete()
    }

    const planets = [
      ['mercury', 'Mercury', 'A year lasts 88 days.'],
      ['venus', 'Venus', 'Hotter than Mercury, though farther from the Sun.'],
      ['earth', 'Earth', 'The only one with oceans on the surface.'],
      ['mars', 'Mars', 'Home of the tallest volcano we know.']
    ]
    const views = {
      list: `<div class="z-view list" data-title="Planets">
               <h1>Planets</h1>
               <div class="row">${planets.map(([id, name]) => `<div class="zoom-me planet ${id}" data-to="${id}">${name}</div>`).join('')}</div>
               <p class="hint">Open a planet and come back. Nothing scales: this driver crossfades.</p>
               <span class="tag">driver: crossfade (your own function)</span>
             </div>`
    }
    for (const [id, name, fact] of planets) {
      views[id] = `<div class="z-view planet-view ${id}" data-title="${name}"><h2>${name}</h2><p>${fact}</p></div>`
    }

    new Zumly({ mount: '.canvas', initialView: 'list', views, transitions: { driver: crossfade, duration: '500ms' }, lateralNav: { swipe: true } }).init()
  </script>
</body>
</html>
