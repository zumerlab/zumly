<body>
  <button class="theme-toggle floating" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">&#9790;</button>
  <div class="zumly-canvas" id="app"></div>
  <noscript>
    <main>
      <h1>Zumly</h1>
      <p>Zumly is a JavaScript library for zoom navigation: click an element and the next view grows out of it. This demo needs JavaScript.</p>
      <p><a href="learn/">Learn Zumly in six steps</a> · <a href="api.html">API reference</a> · <a href="https://github.com/zumerlab/zumly">GitHub</a></p>
    </main>
  </noscript>

  <script src="https://unpkg.com/zumly@0.98.0/dist/zumly.js"></script>
  <script src="js/site.js"></script>
  <script>
  ;(function () {
    'use strict'
    var Z = window.Zumly
    if (!Z) { console.error('Zumly not loaded'); return }

    // Every view lives in its own file; this page only wires them together.
    var views = {
      home: 'views/home.html',
      learn: 'views/learn.html',
      showcases: 'views/showcases.html',
      mercedes: 'views/mercedes.html',
      'home-assistant': 'views/home-assistant.html',
      'mission-control': 'views/mission-control.html',
      // The API reference is a standalone page (api.html); the demo shows its <main>
      api: {
        title: 'API',
        render: function () {
          return fetch('api.html').then(function (r) { return r.text() }).then(function (html) {
            var main = new DOMParser().parseFromString(html, 'text/html').querySelector('main')
            return '<div class="z-view v v-doc"><main>' + main.innerHTML + '</main></div>'
          })
        },
        mounted: function (node) {
          window.enhanceCode(node)
          // In-page links scroll the view: the hash belongs to the router
          node.addEventListener('click', function (e) {
            var a = e.target.closest('a[href^="#"]')
            if (!a) return
            e.preventDefault()
            var target = node.querySelector(a.getAttribute('href'))
            if (target) target.scrollIntoView({ behavior: 'smooth' })
          })
        }
      }
    }

    var app = new Z({
      mount: '#app',
      initialView: 'home',
      views: views,
      preload: ['learn'],
      transitions: {
        duration: '800ms',
        ease: 'cubic-bezier(.4,0,.2,1)',
        effects: ['blur(4px) brightness(0.55)', 'blur(10px) brightness(0.3)']
      },
      depthNav: { style: 'title' },
      lateralNav: { mode: 'always', position: 'top-center', swipe: true, siblings: { home: ['learn', 'showcases', 'api'] } },
      gestures: { follow: true },
      // Sections scroll, so the wheel scrolls them instead of zooming out
      inputs: { wheel: false }
    })

    app.use(Z.Router)

    // Keep preview documents quiet and run full demos only while their view is
    // active. Pausing preserves DOM, form values, animation phase, and clocks.
    var showcaseTransition = false
    var showcaseRecoveryTimer = null
    function syncShowcaseActivity () {
      var current = app.canvas.querySelector(':scope > .is-current-view')
      var activeFrame = null
      app.canvas.querySelectorAll('iframe').forEach(function (frame) {
        var active = !showcaseTransition && !document.hidden &&
          !frame.closest('.sc-preview') && frame.closest('.z-view') === current
        if (active) activeFrame = frame
        frame.contentWindow?.postMessage({ type: 'zumly:showcase-activity', active: active }, window.location.origin)
      })
      var depthNav = app.canvas.querySelector('.z-depth-nav')
      if (depthNav) depthNav.style.display = activeFrame && Number(activeFrame.dataset.showcaseDepth) > 0 ? 'none' : ''
    }
    function pauseShowcases () {
      showcaseTransition = true
      syncShowcaseActivity()
    }
    function recoverShowcases () {
      showcaseRecoveryTimer = null
      // A failed fetch/mount has no after* hook. Check only the engine's busy
      // flag while a navigation is pending, without observing or measuring DOM.
      if (!app.blockEvents) resumeShowcases()
      else showcaseRecoveryTimer = setTimeout(recoverShowcases, 100)
    }
    function pauseForNavigation () {
      pauseShowcases()
      clearTimeout(showcaseRecoveryTimer)
      showcaseRecoveryTimer = setTimeout(recoverShowcases, 100)
    }
    function resumeShowcases () {
      clearTimeout(showcaseRecoveryTimer)
      showcaseRecoveryTimer = null
      showcaseTransition = false
      syncShowcaseActivity()
    }
    ;['beforeZoomIn', 'beforeZoomOut', 'beforeLateral'].forEach(function (event) { app.on(event, pauseForNavigation) })
    ;['afterZoomIn', 'afterZoomOut', 'afterLateral'].forEach(function (event) { app.on(event, resumeShowcases) })
    app.on('viewMounted', syncShowcaseActivity)
    document.addEventListener('visibilitychange', syncShowcaseActivity)

    function onShowcaseMessage (event) {
      if (event.origin !== window.location.origin || !event.data) return
      var frame = Array.from(app.canvas.querySelectorAll('iframe')).find(function (candidate) {
        return candidate.contentWindow === event.source
      })
      if (!frame) return
      if (event.data.type === 'zumly:depth' && Number.isFinite(event.data.depth)) {
        frame.dataset.showcaseDepth = String(event.data.depth)
      } else if (event.data.type !== 'zumly:showcase-ready') {
        return
      }
      syncShowcaseActivity()
    }
    window.addEventListener('message', onShowcaseMessage)
    app.on('destroy', function () {
      clearTimeout(showcaseRecoveryTimer)
      showcaseRecoveryTimer = null
      pauseShowcases()
      document.removeEventListener('visibilitychange', syncShowcaseActivity)
      window.removeEventListener('message', onShowcaseMessage)
    })

    // Copy buttons in fetched views
    app.canvas.addEventListener('click', function (e) {
      var b = e.target.closest('[data-copy]')
      if (!b) return
      navigator.clipboard.writeText(b.getAttribute('data-copy')).then(function () {
        b.textContent = 'Copied'
        setTimeout(function () { b.textContent = 'Copy' }, 1400)
      })
    })

    app.init().then(function () {
      syncShowcaseActivity()
      // GitHub stars (shields.io JSON avoids GitHub API rate limits)
      fetch('https://img.shields.io/github/stars/zumerlab/zumly.json')
        .then(function (r) { return r.json() })
        .then(function (d) {
          var el = document.getElementById('gh-star-count')
          if (el && d.value) el.textContent = '\u2605 ' + d.value
        })
        .catch(function () {})
    })
  })()
  </script>
</body>
