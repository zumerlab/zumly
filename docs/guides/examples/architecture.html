/* ─── The app: a ZUI that walks through the library's own architecture ─── */
/* The site's tokens (css/site.css), so the example matches the pages around it. */
:root {
  --bg: #04101d; --surface: rgba(120, 190, 255, 0.05); --surface-2: rgba(120, 190, 255, 0.09); --ink: #e4effa; --muted: rgba(214, 232, 250, 0.74); --line: rgba(120, 190, 255, 0.16);
  --accent: #6cc2ff; --accent-ink: #021220; --gold: #ffd36a; --gold-soft: rgba(255, 211, 106, 0.18);
  --l0: #8e9bb0; --l1: #4fc1d6; --l2: #6cc2ff; --l3: #5cc98a; --l4: #ffb38a; --l5: #e07ac0; --l6: #ffd36a;
  --tint: 16%; --shadow: 0 14px 40px rgba(0, 0, 0, 0.45); --card: #071a2e;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html.light {
  --bg: #f3f8fd; --surface: rgba(20, 90, 160, 0.05); --surface-2: rgba(20, 90, 160, 0.09); --ink: #0a1f33; --muted: rgba(10, 31, 51, 0.72); --line: rgba(20, 70, 130, 0.16);
  --accent: #155f9e; --accent-ink: #ffffff; --gold: #9a6f00; --gold-soft: rgba(154, 111, 0, 0.14);
  --l0: #5b6474; --l1: #1f7a8c; --l2: #155f9e; --l3: #2e7d4f; --l4: #b85c1e; --l5: #a2357a; --l6: #9a6f00;
  --tint: 10%; --shadow: 0 14px 40px rgba(10, 31, 51, 0.16); --card: #ffffff;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden; padding: 10px 12px; gap: 8px; -webkit-font-smoothing: antialiased; }
button, code, pre { font-family: var(--font); }
button { font-size: inherit; color: inherit; }
code { font-size: .95em; }

.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 34px; }
.bar h1 { font-size: 18px; font-weight: 700; margin: 0; white-space: nowrap; }
/* One line, scrolling sideways: a path that wraps would resize the canvas mid-transition. */
.crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; font-size: 13px; color: var(--muted); min-width: 0; flex: 1; }
.crumbs button { white-space: nowrap; flex-shrink: 0; }
.crumbs button { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-weight: 500; font-size: 12.5px; }
.crumbs button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); cursor: default; }
.crumbs .sep { opacity: .5; }
.tip { margin-left: auto; font-size: 12px; color: var(--muted); }
@media (max-width: 700px) { .tip { display: none; } }

.stage { position: relative; flex: 1; min-height: 0; border-radius: 10px; border: 1px solid var(--line); overflow: clip; background: var(--bg); }
.zumly-canvas { background: transparent; }

/* views */
.z-view { display: grid; place-items: center; left: 0; top: 0; width: 100%; height: 100%; padding: 24px; }
/* Views start at the canvas origin: Zumly centers them over the trigger with its own transform. */
.z-view.sheet { width: min(100%, 1040px); height: min(100%, 720px); padding: 0; }
.sheet > .card { width: 100%; height: 100%; border-radius: 12px; background: var(--card); border: 1px solid color-mix(in srgb, var(--lc, var(--accent)) 50%, var(--line)); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.card .head { padding: 16px 22px 12px; border-bottom: 1px solid var(--line); border-top: 6px solid var(--lc, var(--accent)); background: color-mix(in srgb, var(--lc, var(--accent)) 6%, var(--surface)); display: flex; align-items: baseline; gap: 10px 14px; flex-wrap: wrap; }
.card .head h2 { font-size: clamp(18px, 2.2vw, 24px); font-weight: 700; margin: 0; line-height: 1.2; }
.card .head .z { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--card); background: var(--lc, var(--accent)); border-radius: 4px; padding: 4px 7px; }
.card .head p { margin: 4px 0 0; flex-basis: 100%; color: var(--muted); max-width: 80ch; }
.card .body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 22px 20px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 3px 8px; font-size: 12px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--line); }
h3.k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; font-weight: 700; }
ul.exp { margin: 0; padding-left: 18px; } ul.exp li { margin: 0 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 4px 10px 4px 4px; font-size: 12.5px; cursor: zoom-in; display: inline-flex; gap: 8px; align-items: center; }
.chip i { font-style: normal; font-size: 10px; font-weight: 700; color: var(--card); background: var(--lc, var(--accent)); border-radius: 4px; padding: 3px 5px; line-height: 1; }
.chip:hover { border-color: var(--lc, var(--accent)); }
.chip.flow { padding-left: 10px; border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); }

/* root: a Z axis with the stack, and the references beside it */
.root { padding: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, 1fr); grid-template-rows: auto 1fr; gap: 0 28px; align-items: start; overflow-y: auto; align-content: start; }
.root .intro { grid-column: 1 / -1; padding: 22px 26px 6px; }
.root .intro h1 { font-size: clamp(20px, 2.4vw, 26px); font-weight: 700; line-height: 1.15; margin: 0 0 6px; }
.root .intro p { margin: 0; color: var(--muted); max-width: 90ch; }
.axiswrap { display: grid; grid-template-columns: 64px 1fr; gap: 0 10px; padding: 10px 0 22px 26px; align-items: stretch; }
.axis { position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 6px 0; }
.axis::before { content: ""; position: absolute; left: 50%; top: 42px; bottom: 42px; width: 2px; background: linear-gradient(var(--l6), var(--l0)); border-radius: 1px; }
.axis span { background: var(--bg); padding: 2px 0; line-height: 1.25; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.layer-card { position: relative; display: grid; grid-template-columns: 44px 1fr auto; grid-template-rows: auto auto; gap: 2px 12px; align-items: center; text-align: left; border: 1px solid var(--line); border-left: 6px solid var(--lc); border-radius: 6px; padding: 9px 14px 9px 10px; background: var(--card); cursor: zoom-in; }
.layer-card:hover { border-color: var(--lc); background: color-mix(in srgb, var(--lc) 8%, var(--surface)); }
.layer-card b { grid-column: 2; grid-row: 1; }
.layer-card .mini { grid-column: 2; grid-row: 2; }
.layer-card .z { grid-column: 1; grid-row: 1 / 3; width: 44px; height: 44px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--card); background: var(--lc); border-radius: 6px; letter-spacing: .04em; }
.layer-card b { font-size: 15px; font-weight: 700; }
.layer-card .count { grid-column: 3; grid-row: 1 / 3; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.layer-card .mini { display: flex; flex-wrap: wrap; gap: 4px; }
.layer-card .mini span { font-size: 10.5px; line-height: 1; padding: 3px 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.refs { padding: 10px 26px 22px 0; display: flex; flex-direction: column; gap: 8px; }
.refs h2 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 0 2px; }
.refs .why { font-size: 12.5px; color: var(--muted); margin: 0 0 6px; }
.extra { display: grid; grid-template-columns: 1fr; gap: 6px; text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--card); cursor: zoom-in; }
.extra:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.extra b { font-size: 15px; } .extra span { color: var(--muted); font-size: 12.5px; }
.extra .mini { display: flex; gap: 3px; }
.extra .mini i { height: 6px; flex: 1; border-radius: 2px; background: var(--c); opacity: .9; }
@media (max-width: 760px) { .root { grid-template-columns: 1fr; } .axiswrap { padding: 6px 18px 10px; grid-template-columns: 1fr; } .axis { display: none; } .refs { padding: 0 18px 18px; } .layer-card .mini { display: none; } .root .intro { padding: 18px 18px 6px; } }

/* where you are in the stack: a strip of the seven layers on every sheet */
.strip { display: flex; gap: 3px; align-items: center; margin: 2px 0 0; flex-basis: 100%; }
.strip i { flex: 1; height: 7px; border-radius: 2px; background: var(--c); opacity: .3; }
.strip i.on { opacity: 1; height: 10px; outline: 2px solid color-mix(in srgb, var(--c) 40%, transparent); outline-offset: 1px; }
.strip i.part { opacity: .75; }
.strip small { font-size: 11px; color: var(--muted); margin-left: 8px; white-space: nowrap; }

/* layer: grid of modules */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.mod { position: relative; text-align: left; border: 1px solid color-mix(in srgb, var(--lc) 50%, var(--line)); border-radius: 8px; padding: 12px 14px 10px; background: var(--card); cursor: zoom-in; display: flex; flex-direction: column; gap: 2px; min-height: 92px; }
.mod:hover { border-color: var(--lc); }
.mod.big { grid-column: 1 / -1; background: color-mix(in srgb, var(--lc) var(--tint), var(--surface)); }
.mod.ext { border-style: dashed; background: var(--surface-2); }
.mod b { font-size: 15px; font-weight: 700; line-height: 1.2; }
.mod .f { font-size: 11.5px; color: var(--muted); }
.mod .n { position: absolute; right: 12px; top: 10px; font-size: 11px; color: color-mix(in srgb, var(--lc) 80%, var(--ink)); }
.mod .tag { margin-top: auto; align-self: flex-start; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--lc); font-weight: 700; }

/* flows and options */
.flowgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.flowcard { text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--card); cursor: zoom-in; }
.flowcard:hover { border-color: var(--gold); }
.flowcard b { font-size: 16px; display: block; margin-bottom: 4px; } .flowcard span { color: var(--muted); font-size: 12.5px; } .flowcard em { display: block; margin-top: 8px; font-style: normal; font-size: 11px; font-weight: 700; color: var(--gold); }
ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 8px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.step::before { counter-increment: s; content: counter(s); font-size: 12px; font-weight: 700; line-height: 24px; width: 24px; height: 24px; border-radius: 50%; text-align: center; background: var(--gold); color: var(--card); }
.step .chips { margin-top: 6px; }
.optgroup { font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
.opt { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; background: var(--surface-2); }
.opt .k { font-size: 13px; font-weight: 700; } .opt .d { font-size: 12px; color: var(--muted); text-align: right; } .opt .s { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.opt .chips { grid-column: 1 / -1; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; } th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; } td code { white-space: nowrap; }
pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; line-height: 1.5; margin: 6px 0 10px; white-space: pre; }
.tablewrap { overflow-x: auto; }

.zumly-canvas .z-nav-back, .zumly-canvas .z-depth-band, .zumly-canvas .z-lateral-nav { color: var(--ink); }
.zoom-me:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

const TRIGGER_ATTRS = [
  ['data-to', 'Target view (required).'], ['data-*', 'Any other data attribute reaches the view as ctx.props and tells siblings apart (data-id).'],
  ['data-title', 'Readable name for the sibling bar and the back button.'], ['data-with-duration / -ease / -cover / -stagger / -effects', 'Override transitions for that trigger.'],
  ['data-hide-trigger[="fade"]', 'Hides or fades the trigger during the zoom.'], ['data-deferred', 'Renders the content after the animation.'],
  ['data-sibling="false"', 'Keeps the trigger out of the sibling group.'], ['data-no-swipe', 'A horizontal drag inside does not zoom out.'], ['data-rasterize (on the view)', '"true" or "false" forces or prevents the photo.']
]

const FLOWS = [
  { id: 'zoomin', name: 'Zoom in', desc: 'A click on a .zoom-me[data-to] trigger. The new view grows out of the trigger.', steps: [
    ['mouseup, touchend or Enter on the trigger → onZoom() → zoomIn(el)', ['zumly','currv']],
    ['_runNavigation: blockEvents = true, the prefetcher pauses, a task with its promise is created', ['zumly','prefetcher']],
    ['beforeZoomIn hook. The ViewContext is built: target, props = the trigger dataset, trigger, context', ['zumly','resolver']],
    ['prefetcher.get(name): a clone from the cache, or ViewResolver.resolve() by source type; onCleanup/onActivate get registered', ['prefetcher','cache','resolver','lifecycle']],
    ['prepareAndInsertView: .z-view, data-view-name, aria-label, the is-new-current-view/has-no-events/hide classes, append, mounted() → viewMounted hook', ['utils','a11y','currv']],
    ['Geometry: one batch of rect reads, then pure math: cover scale, start and end transform of the new view, origin and end of the parent, end of the grandparent', ['geometry','zumly']],
    ['Snapshot: createZoomSnapshot(current, previous, last, detached) → storedViews.push; effects and hideTrigger as CSS variables', ['snapshots','style','prevv','lastv']],
    ['zoomInStart hook (the router writes the hash). _runNavigationTransition: flattener.before() puts the photos in place, webgl.wrap() decides who draws, safety timer, driver.runTransition(spec, complete)', ['router','flatten','webgl','dindex','css']],
    ['complete: deferred content reattached, blockEvents = false, content-visibility restored, background inert, focus to the view, DepthNav and sibling bar, afterZoomIn and viewChanged hooks, flattener.settle()', ['zumly','visibility','a11y','depthnav','dnav','lnav','flatten']]
  ] },
  { id: 'zoomout', name: 'Zoom out', desc: 'A click outside the current view, wheel, ArrowLeft, swipe, the back button, or zoomOut(n | { to }).', steps: [
    ['Input → zoomOut(). _zoomOutLevels decides how many levels; more than one goes through _performZoomOutLevels with "passengers"', ['zumly','depthnav','dnav']],
    ['beforeZoomOut hook. .zoomed is removed from the trigger and its visibility restored; with "fade" the outgoing view fades out', ['zumly','style','prevv']],
    ['Role swap: previous → current, last → previous; the detached node from the snapshot returns to the canvas as the last view', ['snapshots','visibility','lastv']],
    ['_fadeIntoTrigger: a WAAPI opacity animation over the last third, independent of the driver', ['zumly']],
    ['Driver runTransition of type zoomOut (forwardState → backwardState); with several levels the poses compose and the passengers follow the shrinking view every frame', ['dindex','geometry','flatten','webgl']],
    ['complete: storedViews.pop(), the lateral history of the parent level returns, activateView() runs onActivate, afterZoomOut and viewChanged hooks', ['zumly','lifecycle','router']]
  ] },
  { id: 'lateral', name: 'Lateral (siblings)', desc: 'A click on another parent trigger, the sibling bar, a swipe with lateralNav.swipe, or goTo(name, { mode: "lateral" }).', steps: [
    ['Input → _doLateral(key). _findSiblingTriggerAtPoint hit-tests the parent triggers (which receive no events)', ['zumly','prevv','lnav']],
    ['Identity: viewKey(name, params) tells "room?id=kitchen" from "room?id=bedroom"; matchIdentity finds current and target among the triggers', ['identity']],
    ['keepAlive: the .is-lateral-hidden node is reused when present; otherwise prefetcher.get + prepareAndInsertView', ['prefetcher','utils','currv']],
    ['Lateral geometry: the slide follows the declared order or the trigger positions; _lateralTargetGeometry recomputes the poses of the three layers and the scale', ['geometry','zumly']],
    ['History: the outgoing entry is stored with a copy of the stage (and the node when keepAlive); back() consumes it before zooming out', ['snapshots','zumly']],
    ['Driver runTransition of type lateral: css and waapi animate the slide with a fade; the others use runLateralInstant', ['dindex','css','waapi','helpers']],
    ['complete: the outgoing view is hidden or removed, sibling bar updated, afterLateral and viewChanged hooks', ['zumly','lnav','router']]
  ] },
  { id: 'gesture', name: 'Gesture that follows the finger', desc: 'With gestures.follow: trackpad, swipe or pinch drive the zoom-out with their progress.', steps: [
    ['Wheel with small deltas, a swipe to the left or a closing pinch → _beginZoomOutScrub(source)', ['zumly']],
    ['Layers: for current, previous and last, a paused WAAPI animation (transform, filter, trigger radius) from forwardState toward backwardState', ['zumly','snapshots','currv','prevv']],
    ['Every move: _scrubZoomOut(p) sets currentTime = p·1000 ms; webgl.scrubTo, DepthNav.setProgress (--z-progress) and the zoomOutProgress hook', ['webgl','depthnav','dnav']],
    ['Release: _endZoomOutScrub(commit) by threshold or a flick; the layers keep decelerating to the end and then zoomOut({ instant: true }) settles the state, or everything goes back', ['zumly','flatten']]
  ] },
  { id: 'life', name: 'init and destroy', desc: 'How an instance starts and how it cleans up.', steps: [
    ['new Zumly(options): checkParameters validates and normalizes; the canvas is found; getDriver; events are bound; the ViewPrefetcher is created', ['utils','dindex','prefetcher','canvas']],
    ['init(): preload, resolve and prepare initialView, root snapshot, a11y.sync, Flattener and WebGL when requested, plugin install, viewChanged "init"', ['zumly','resolver','flatten','webgl','router']],
    ['destroy(): destroy hook, webgl and flattener, cancel the running navigation, timers, listeners, nav UI, disposeView of everything (onCleanup), restore the canvas attributes and class', ['zumly','lifecycle','depthnav','a11y']]
  ] }
]

const API_METHODS = [
  ['init()', 'Promise. Resolves the initial view and installs plugins.'], ['destroy()', 'Leaves the canvas as it was. The instance becomes inert.'],
  ['zoomIn(el)', 'Zoom from a real trigger.'], ['zoomTo(name, { duration, ease, props })', 'Programmatic zoom from a centered synthetic origin.'],
  ['zoomOut(n | { to, levels, duration, ease })', 'One level, several, or up to an ancestor, in one transition.'], ['goTo(name, { mode, props })', '"depth" (zoomTo) or "lateral".'],
  ['back()', 'Undoes the last lateral move of the level; otherwise zooms out.'], ['canGoBack()', 'Whether back() would do anything.'],
  ['zoomLevel() / getZoomLevel()', 'Depth = storedViews.length.'], ['getCurrentViewName()', 'Name of the current view.'],
  ['getViewTitle(name) · getViewStack()', 'Titles, and the stack root → current with params.'], ['on(event, fn) · off(event, fn?)', 'Chainable hooks.'], ['use(plugin, opts)', 'install(instance, opts) during init(), or at once if already started.']
]
const API_EVENTS = [
  ['beforeZoomIn · zoomInStart · afterZoomIn', '{ viewName, zoomLevel }'], ['beforeZoomOut · afterZoomOut', '{ zoomLevel, viewName, from, levels? }'],
  ['beforeLateral · lateralStart · afterLateral', '{ viewName, from, isBack }'], ['viewMounted', '{ viewName, node }'],
  ['viewChanged', '{ type: init|zoomIn|zoomOut|lateral, viewName, from, zoomLevel, node }'], ['zoomOutProgress', '{ phase: start|move|commit|cancel|end, progress, source }'], ['destroy', '—']
]

// ─── Views ────────────────────────────────────────────────────────────────
const byId = Object.fromEntries(NODES.map(n => [n.id, n]))
const layerIndex = Object.fromEntries(LAYERS.map((l, i) => [l.id, i]))
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
const lc = id => LAYERS[layerIndex[id]].color
const modChip = id => { const n = byId[id]; return `<button type="button" class="zoom-me chip" data-to="mod-${id}" data-title="${esc(n.label)}" data-sibling="false" style="--lc:${lc(n.layer)}"><i>Z${layerIndex[n.layer]}</i>${esc(n.label)}</button>` }
// The seven layers as a strip; `on` is the layer you are in, `part` the layers that take part.
const strip = (on, part = [], note = '') => `<div class="strip" aria-label="Layers">${LAYERS.map(l => `<i style="--c:${l.color}" class="${l.id === on ? 'on' : part.includes(l.id) ? 'part' : ''}" title="Z${layerIndex[l.id]} ${esc(l.name)}"></i>`).join('')}${note ? `<small>${esc(note)}</small>` : ''}</div>`
const layersOf = ids => [...new Set(ids.map(id => byId[id].layer))]
const flowChip = id => { const f = FLOWS.find(x => x.id === id); return `<button type="button" class="zoom-me chip flow" data-to="flow-${id}" data-title="${esc(f.name)}" data-sibling="false">${esc(f.name)}</button>` }
const sheet = (title, color, inner) => `<div class="z-view sheet" data-title="${esc(title)}" style="--lc:${color}"><div class="card">${inner}</div></div>`

const views = {}

views.root = () => `<div class="z-view root" data-title="Zumly">
  <div class="intro">
    <h1>Zumly, layer by layer</h1>
    <p>The library is a stack. The browser sees the top layer; the tooling sits at the bottom; every layer uses the ones below it. Open a layer to see its files, open a file to see what it does and what it depends on. This page runs on Zumly itself.</p>
  </div>
  <div class="axiswrap">
    <div class="axis"><span>Browser<br>↑</span><span>Z axis</span><span>↓<br>Toolchain</span></div>
    <div class="stack">${[...LAYERS].reverse().map(l => { const i = layerIndex[l.id]; const mods = NODES.filter(n => n.layer === l.id); const lines = mods.reduce((t, n) => t + (n.n || 0), 0)
      return `<button type="button" class="zoom-me layer-card" data-to="layer-${l.id}" data-title="Z${i} ${esc(l.name)}" style="--lc:${l.color}"><span class="z">Z${i}</span><b>${esc(l.name)}</b><span class="count">${mods.length} parts${lines ? `<br>${lines.toLocaleString('en')} lines` : ''}</span><span class="mini">${mods.map(n => `<span>${esc(n.label)}</span>`).join('')}</span></button>` }).join('')}
    </div>
  </div>
  <div class="refs">
    <h2>Across the layers</h2>
    <p class="why">The stack says where the code lives. These three say how it works together: each one links back into the files of the stack.</p>
    <button type="button" class="zoom-me extra" data-to="flows" data-title="Flows"><b>Flows</b><span>A zoom in, a zoom out, a lateral move, a gesture, init and destroy: the steps each one takes, and the file that runs each step.</span><span class="mini">${LAYERS.map(l => `<i style="--c:${l.color}"></i>`).join('')}</span></button>
    <button type="button" class="zoom-me extra" data-to="options" data-title="Options"><b>Options</b><span>Every key of new Zumly({ … }) with its default, and the files that read it.</span><span class="mini">${LAYERS.map(l => `<i style="--c:${l.color}"></i>`).join('')}</span></button>
    <button type="button" class="zoom-me extra" data-to="api" data-title="API"><b>API</b><span>Instance methods, events, the view context and the driver contract.</span><span class="mini">${['entries','core','drivers'].map(id => `<i style="--c:${lc(id)}"></i>`).join('')}</span></button>
  </div>
</div>`

for (const l of LAYERS) {
  const i = layerIndex[l.id]
  views['layer-' + l.id] = () => sheet(`Z${i} ${l.name}`, l.color, `
    <div class="head"><span class="z">Z${i}</span><h2>${esc(l.name)}</h2>${strip(l.id, [], `layer ${i + 1} of 7, bottom to top`)}<p>${esc(l.desc)}</p></div>
    <div class="body"><div class="grid">${NODES.filter(n => n.layer === l.id).map(n => `<button type="button" class="zoom-me mod${n.big ? ' big' : ''}${n.ext ? ' ext' : ''}" data-to="mod-${n.id}" data-title="${esc(n.label)}" style="--lc:${l.color}"><b>${esc(n.label)}</b><span class="f">${esc(n.file)}</span>${n.n ? `<span class="n">${n.n}</span>` : ''}<span class="tag">${esc(n.tag || '')}</span></button>`).join('')}</div></div>`)
}

for (const n of NODES) {
  views['mod-' + n.id] = () => {
    const deps = EDGES.filter(e => e[0] === n.id).map(e => e[1])
    const users = EDGES.filter(e => e[1] === n.id).map(e => e[0])
    const flows = FLOWS.filter(f => f.steps.some(s => s[1].includes(n.id)))
    return sheet(n.label, lc(n.layer), `
      <div class="head"><span class="z">Z${layerIndex[n.layer]}</span><h2>${esc(n.label)}</h2>${strip(n.layer, layersOf([...deps, ...users]), deps.length || users.length ? 'its layer, and the layers it is wired to' : 'its layer')}<p>${esc(n.sum)}</p></div>
      <div class="body">
        <div class="meta"><span class="pill"><span style="width:8px;height:8px;border-radius:2px;background:${lc(n.layer)};display:inline-block"></span>${esc(LAYERS[layerIndex[n.layer]].name)}</span><span class="pill">${esc(n.file)}</span>${n.n ? `<span class="pill">${n.n.toLocaleString('en')} lines</span>` : ''}${n.tag ? `<span class="pill">${esc(n.tag)}</span>` : ''}</div>
        ${n.exp ? `<h3 class="k">Exposes / contains</h3><ul class="exp">${n.exp.map(e => `<li><code>${esc(e)}</code></li>`).join('')}</ul>` : ''}
        ${n.opts ? `<h3 class="k">Options it reads</h3><div class="chips">${n.opts.map(o => `<span class="pill">${esc(o)}</span>`).join('')}</div>` : ''}
        ${deps.length ? `<h3 class="k">Depends on. Open one to follow the chain</h3><div class="chips">${deps.map(modChip).join('')}</div>` : ''}
        ${users.length ? `<h3 class="k">Used by</h3><div class="chips">${users.map(modChip).join('')}</div>` : ''}
        ${flows.length ? `<h3 class="k">Appears in these flows</h3><div class="chips">${flows.map(f => flowChip(f.id)).join('')}</div>` : ''}
      </div>`)
  }
}

views.flows = () => sheet('Flows', 'var(--gold)', `
  <div class="head"><h2>Flows</h2>${strip(null, LAYERS.map(l => l.id), 'a navigation crosses most layers')}<p>Five walks through the engine. Each step names the files involved, with the layer they belong to; open one to keep going.</p></div>
  <div class="body"><div class="flowgrid">${FLOWS.map(f => `<button type="button" class="zoom-me flowcard" data-to="flow-${f.id}" data-title="${esc(f.name)}"><b>${esc(f.name)}</b><span>${esc(f.desc)}</span><em>${f.steps.length} steps · ${layersOf(f.steps.flatMap(st => st[1])).length} layers</em></button>`).join('')}</div></div>`)

for (const f of FLOWS) {
  views['flow-' + f.id] = () => sheet(f.name, 'var(--gold)', `
    <div class="head"><h2>${esc(f.name)}</h2>${strip(null, layersOf(f.steps.flatMap(st => st[1])), 'layers this flow touches')}<p>${esc(f.desc)}</p></div>
    <div class="body"><ol class="steps">${f.steps.map(s => `<li class="step"><div>${esc(s[0])}<div class="chips">${s[1].map(modChip).join('')}</div></div></li>`).join('')}</ol></div>`)
}

views.options = () => sheet('Options', 'var(--accent)', `
  <div class="head"><h2>Options</h2>${strip(null, layersOf(OPTIONS.flatMap(o => o.c || [])), 'layers that read options')}<p>Every key of new Zumly({ … }) with its default as checkParameters sets it. Under each option, the files that read it.</p></div>
  <div class="body">${OPTIONS.map(o => o.g ? `<div class="optgroup">${esc(o.g)}</div>` : `<div class="opt"><span class="k">${esc(o.k)}</span><span class="d">${esc(o.d)}</span><span class="s">${esc(o.s)}</span><div class="chips">${o.c.map(modChip).join('')}</div></div>`).join('')}
    <h3 class="k">Attributes per trigger and per view</h3><div class="tablewrap"><table><tbody>${TRIGGER_ATTRS.map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div></div>`)

views.api = () => sheet('API', 'var(--accent)', `
  <div class="head"><h2>API</h2>${strip(null, ['entries', 'core', 'drivers'], 'entry points, engine, drivers')}<p>What the package exports and what a driver receives.</p></div>
  <div class="body">
    <h3 class="k">Instance methods</h3><div class="tablewrap"><table><tbody>${API_METHODS.map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div>
    <h3 class="k">Events (on / off)</h3><div class="tablewrap"><table><tbody>${API_EVENTS.map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td><code>${esc(v)}</code></td></tr>`).join('')}</tbody></table></div>
    <h3 class="k">Context of a function or object view</h3><pre>({ target, props, trigger, context, onCleanup, onActivate }) =>
  string | HTMLElement | void   // void: target is the view</pre>
    <h3 class="k">Driver contract</h3><pre>runTransition(spec, onComplete)
spec.type: 'zoomIn' | 'zoomOut' | 'lateral'
spec.currentStage.views[i]: { viewName, backwardState, forwardState }
zoomIn:  backward → forward · zoomOut: forward → backward
onComplete(): exactly once, always</pre>
    <h3 class="k">What this page asks of Zumly</h3><pre>new Zumly({
  mount: '#app', initialView: 'root', views,
  transitions: { duration: '750ms', ease: 'cubic-bezier(.2,.8,.2,1)', hideTrigger: 'fade',
                 effects: ['brightness(.8)', 'brightness(.55)'] },
  depthNav: { style: 'title' }, lateralNav: { arrows: true, dots: true },
  gestures: { follow: true }, inputs: { pinch: true }
})</pre>
    <h3 class="k">Modules this page relies on</h3><div class="chips">${['zumly','utils','geometry','resolver','dindex','css','depthnav'].map(modChip).join('')}</div>
  </div>`)

// ─── The instance ─────────────────────────────────────────────────────────
const app = new Zumly({
  mount: '#app',
  initialView: 'root',
  views,
  // No blur in the effects: a blur on a layer scaled 100x (deep chains of small triggers) costs the whole frame budget.
  transitions: { duration: '750ms', ease: 'cubic-bezier(.2,.8,.2,1)', hideTrigger: 'fade', effects: ['brightness(.8)', 'brightness(.55)'] },
  depthNav: { style: 'title', position: 'bottom-left' },
  lateralNav: { arrows: true, dots: true, position: 'bottom-center' },
  gestures: { follow: true },
  inputs: { pinch: true }
})

const crumbs = document.getElementById('crumbs')
function renderCrumbs () {
  const stack = app.getViewStack()
  crumbs.innerHTML = stack.map((v, i) => `${i ? '<span class="sep">›</span>' : ''}<button type="button" data-name="${esc(v.name)}" ${i === stack.length - 1 ? 'aria-current="page"' : ''}>${esc(v.title)}</button>`).join('')
}
crumbs.addEventListener('click', e => {
  const b = e.target.closest('button[data-name]'); if (!b || b.getAttribute('aria-current')) return
  app.zoomOut({ to: b.dataset.name })
})
app.on('viewChanged', renderCrumbs)
app.init()
</script>
<script>
  // Follow the site's theme toggle (the parent page writes zumly-theme in localStorage)
  window.addEventListener('storage', function (e) {
    if (e.key === 'zumly-theme') document.documentElement.classList.toggle('light', e.newValue === 'light')
  })
</script>
</body>
</html>
