<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zumly · Navigate from code</title>
  <link rel="stylesheet" href="https://unpkg.com/zumly@0.98.0/dist/zumly.css">
  <script src="https://unpkg.com/zumly@0.98.0/dist/zumly.js"></script>
  <style>
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #0b2a44; display: flex; flex-direction: column; height: 100vh; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; background: #0b2a44; }
    .toolbar button { font: 13px ui-monospace, monospace; padding: 6px 10px; border: 0; border-radius: 8px; background: #3da9fc; color: white; cursor: pointer; }
    .toolbar button:disabled { opacity: .35; cursor: default; }
    .path { margin: 0; padding: 8px 12px; font-size: 14px; background: #d8ecfb; }
    .stage { position: relative; flex: 1; }
    .z-view { display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; }
    .home { width: 100%; height: 100%; background: #eaf5fd; }
    .card { width: 240px; height: 180px; border-radius: 22px; background: white; box-shadow: 0 12px 40px #0b2a4433; }
    .zoom-me { cursor: zoom-in; padding: 8px 16px; border-radius: 99px; background: #3da9fc; color: white; }
    h1, h2 { margin: 0; }
  </style>
</head>
<body>
  <nav class="toolbar">
    <button data-in="home" onclick="app.zoomTo('settings')">zoomTo('settings')</button>
    <button data-in="profile" onclick="app.goTo('privacy', { mode: 'lateral' })">goTo('privacy', lateral)</button>
    <button data-in="settings profile privacy" onclick="app.zoomOut({ to: 'home' })">zoomOut({ to: 'home' })</button>
    <button onclick="app.back()">back()</button>
  </nav>
  <p class="path"></p>
  <div class="stage">
    <div class="canvas zumly-canvas"></div>
  </div>
  <script>
    const app = new Zumly({
      mount: '.canvas',
      initialView: 'home',
      views: {
        home: `<div class="z-view home" data-title="Home">
                 <h1>Home</h1>
                 <div class="zoom-me" data-to="settings">Settings</div>
               </div>`,
        settings: `<div class="z-view card" data-title="Settings">
                     <h2>Settings</h2>
                     <div class="zoom-me" data-to="profile">Profile</div>
                     <div class="zoom-me" data-to="privacy">Privacy</div>
                   </div>`,
        profile: `<div class="z-view card" data-title="Profile"><h2>Profile</h2></div>`,
        privacy: `<div class="z-view card" data-title="Privacy"><h2>Privacy</h2></div>`
      }
    })

    // After every navigation: show where we are, enable the buttons that apply here
    app.on('viewChanged', ({ viewName }) => {
      document.querySelector('.path').textContent =
        app.getViewStack().map(view => view.title).join(' › ')
      document.querySelectorAll('[data-in]').forEach(button => {
        button.disabled = !button.dataset.in.split(' ').includes(viewName)
      })
    })

    // Optional: the URL hash follows navigation, and the browser back button goes back
    app.use(Zumly.Router)
    app.init()
  </script>
</body>
</html>
