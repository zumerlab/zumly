<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zumly · Depth</title>
  <link rel="stylesheet" href="https://unpkg.com/zumly/dist/zumly.css">
  <script src="https://unpkg.com/zumly/dist/zumly.js"></script>
  <style>
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #0b2a44; }
    .stage { position: relative; height: 100vh; }
    .z-view { display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; }
    .ocean { width: 100%; height: 100%; background: linear-gradient(#bfe6ff, #2a7fc4); }
    /* A level and the trigger that opens it share a shape, so the view grows out of it */
    .level, .peek { width: 300px; height: 210px; border-radius: 28px; }
    .peek { width: 150px; height: 105px; border-radius: 14px; cursor: zoom-in; display: grid; place-content: center; font-weight: 600; color: white; }
    .reef { background: #ff8a65; }
    .anemone { background: #ba68c8; }
    .clownfish { background: #ffb300; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1.05rem; color: white; }
    .level p { color: white; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="canvas zumly-canvas"></div>
  </div>
  <script>
    const app = new Zumly({
      mount: '.canvas',
      initialView: 'ocean',
      views: {
        ocean: `<div class="z-view ocean" data-title="Ocean">
                  <h1>The ocean</h1>
                  <div class="zoom-me peek reef" data-to="reef">Coral reef</div>
                </div>`,
        reef: `<div class="z-view level reef" data-title="Coral reef">
                 <h2>Coral reef</h2>
                 <div class="zoom-me peek anemone" data-to="anemone">Anemone</div>
               </div>`,
        anemone: `<div class="z-view level anemone" data-title="Anemone">
                    <h2>Anemone</h2>
                    <div class="zoom-me peek clownfish" data-to="clownfish">Clownfish</div>
                  </div>`,
        clownfish: `<div class="z-view level clownfish" data-title="Clownfish">
                      <h2>Clownfish</h2>
                      <p>Four levels deep.</p>
                    </div>`
      },
      // The back button shows the title of the view above
      depthNav: { style: 'title' }
    })
    app.init()
  </script>
</body>
</html>
