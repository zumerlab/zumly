<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zumly · Depth</title>
  <link rel="stylesheet" href="https://unpkg.com/zumly@1.0.0/dist/zumly.css">
  <script src="https://unpkg.com/zumly@1.0.0/dist/zumly.js"></script>
  <style>
    body { margin: 0; font: 17px/1.4 system-ui, sans-serif; color: #0b2a44; }
    .stage { position: relative; height: 100vh; }
    .z-view { display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; }
    .ocean { width: 100%; height: 100%; background: linear-gradient(#bfe6ff, #2a7fc4); }
    .card { width: 280px; height: 220px; border-radius: 24px; background: white; box-shadow: 0 12px 40px #0b2a4433; }
    h1, h2 { margin: 0; }
    .zoom-me { cursor: zoom-in; padding: 10px 18px; border-radius: 99px; background: #3da9fc; color: white; font-weight: 600; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="canvas zumly-canvas"></div>
  </div>
  <script>
    const app = new Zumly({
      mount: '.canvas',
      initialView: 'ocean',
      views: {
        ocean: `<div class="z-view ocean" data-title="Ocean">
                  <h1>The ocean</h1>
                  <div class="zoom-me" data-to="reef">Coral reef</div>
                </div>`,
        reef: `<div class="z-view card" data-title="Coral reef">
                 <h2>Coral reef</h2>
                 <div class="zoom-me" data-to="anemone">Anemone</div>
               </div>`,
        anemone: `<div class="z-view card" data-title="Anemone">
                    <h2>Anemone</h2>
                    <div class="zoom-me" data-to="clownfish">Clownfish</div>
                  </div>`,
        clownfish: `<div class="z-view card" data-title="Clownfish">
                      <h2>Clownfish</h2>
                      <p>Four levels deep.</p>
                    </div>`
      },
      // The back button shows the title of the view above
      depthNav: { style: 'title' }
    })
    app.init()
  </script>
</body>
</html>
