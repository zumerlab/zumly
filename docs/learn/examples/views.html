<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zumly · Views</title>
  <link rel="stylesheet" href="https://unpkg.com/zumly/dist/zumly.css">
  <script src="https://unpkg.com/zumly/dist/zumly.js"></script>
  <style>
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #0b2a44; }
    .stage { position: relative; height: 100vh; }
    .z-view { display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; }
    .shop { width: 100%; height: 100%; background: #eaf5fd; }
    .row { display: flex; gap: 14px; }
    /* Tiles and the views they open share a 4:3 shape, so each view grows out of its tile */
    .tile, .card { border-radius: 14px; box-sizing: border-box; }
    .tile { width: 132px; height: 99px; padding: 10px; cursor: zoom-in; display: grid; place-content: center; gap: 4px; font-weight: 600; }
    .card { width: 360px; height: 270px; padding: 20px; border-radius: 28px; }
    .tile small, .source { font-size: 12px; opacity: 0.75; }
    .source { padding: 4px 10px; border-radius: 99px; background: #0b2a4414; }
    .clownfish { background: #ff9f43; color: #3b1d00; }
    .tang { background: #3da9fc; color: #04223a; }
    .hours { background: white; }
    h1, h2, p { margin: 0; }
    button { font: inherit; padding: 8px 16px; border: 0; border-radius: 99px; background: #0b2a44; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="canvas zumly-canvas"></div>
  </div>
  <script>
    const basket = []
    const fishes = { Clownfish: 'clownfish', 'Blue tang': 'tang' }

    const app = new Zumly({
      mount: '.canvas',
      initialView: 'shop',
      views: {
        // A function: paints from state, and again each time you come back
        shop: ({ target, onActivate }) => {
          target.className = 'z-view shop'
          const paint = () => {
            target.innerHTML = `
              <h1>Fish shop</h1>
              <p>Basket: ${basket.join(', ') || 'empty'}</p>
              <div class="row">
                <div class="zoom-me tile clownfish" data-to="fish" data-name="Clownfish">Clownfish<small>function + props</small></div>
                <div class="zoom-me tile tang" data-to="fish" data-name="Blue tang">Blue tang<small>function + props</small></div>
                <div class="zoom-me tile hours" data-to="hours">Opening hours<small>URL</small></div>
              </div>`
          }
          paint()
          onActivate(paint)
        },
        // One function for both fish: the trigger's data-* arrive as props
        fish: ({ target, props }) => {
          target.className = `z-view card ${fishes[props.name]}`
          target.dataset.title = props.name
          target.innerHTML = `
            <span class="source">fish({ props: { name: '${props.name}' } })</span>
            <h2>${props.name}</h2>
            <button>Add to basket</button>`
          target.querySelector('button').onclick = () => {
            basket.push(props.name)
            app.zoomOut()
          }
        },
        // A URL: fetched the first time, then cached
        hours: 'hours.html'
      },
      lateralNav: false
    })
    app.init()
  </script>
</body>
</html>
